<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Solblik – sunglasses</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
  <style>:root {
  --bg: #eef0ea;
  --ink: #1c2320;
  --moss: #6b7455;
  --sky: #c9d6e3;
  --line: #cfd4c6;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Bricolage Grotesque", system-ui, sans-serif; line-height: 1.5; }
.top { display: flex; justify-content: space-between; align-items: center; padding: 1rem 2rem; border-bottom: 1px solid var(--line); }
.brand { font-weight: 800; font-size: 1.4rem; color: var(--ink); text-decoration: none; }
.cart-btn { background: none; border: 1px solid var(--ink); border-radius: 999px; padding: .4rem 1rem; font: inherit; color: var(--ink); cursor: pointer; }
.hero { padding: 5rem 2rem 3rem; max-width: 60rem; }
.hero h1 { font-size: clamp(2.5rem, 8vw, 5.5rem); line-height: 1; margin: 0 0 1rem; font-weight: 800; }
.hero p { max-width: 34rem; margin: 0 0 1.5rem; }
.btn { display: inline-block; background: var(--ink); color: var(--bg); border: 0; border-radius: 4px; padding: .8rem 1.4rem; font: inherit; font-weight: 600; text-decoration: none; cursor: pointer; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(16rem, 1fr)); gap: 1.5rem; padding: 2rem; }
.card { border-top: 2px solid var(--ink); padding-top: 1rem; }
.card .pic { background: var(--sky); border-radius: 4px; padding: 1.5rem 1rem; }
.card .pic img { width: 100%; display: block; border-radius: 4px; }
.card .pic:has(img) { padding: 0; background: none; }
.card h3 { margin: 1rem 0 .2rem; }
.card p { margin: 0 0 .8rem; color: var(--moss); }
.card button { width: 100%; }
.cart { position: fixed; right: 0; top: 0; height: 100%; width: min(22rem, 100%); background: #fff; padding: 1.5rem; border-left: 1px solid var(--line); overflow-y: auto; }
.cart[hidden] { display: none; }
.cart ul { list-style: none; padding: 0; }
.cart li { display: flex; justify-content: space-between; padding: .5rem 0; border-bottom: 1px solid var(--line); }
a:focus-visible, button:focus-visible { outline: 3px solid var(--moss); outline-offset: 2px; }

:root { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.msg { margin: .8rem 0 0; color: var(--moss); }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #171c19; --ink: #eef0ea; --moss: #a9b48c; --sky: #2a3540; --line: #34403a; }
  :root:not([data-theme="light"]) .cart { background: #1f2622; }
}
:root[data-theme="dark"] { --bg: #171c19; --ink: #eef0ea; --moss: #a9b48c; --sky: #2a3540; --line: #34403a; }
:root[data-theme="dark"] .cart { background: #1f2622; }

.checkout-box label { display: block; margin-top: .8rem; font-weight: 600; }
.checkout-box input { display: block; width: 100%; margin-top: .3rem; padding: .6rem; border: 1px solid var(--line); border-radius: 4px; font: inherit; background: transparent; color: var(--ink); }
.checkout-box .btn { margin-top: 1rem; width: 100%; }
.err { color: #d64545; margin: .6rem 0 0; }
</style>
</head>
<body>
  <header class="top">
    <a class="brand" href="#">Solblik</a>
    <button id="cart-toggle" class="cart-btn" aria-controls="cart" aria-expanded="false">Cart (<span id="cart-count">0</span>)</button>
  </header>

  <main>
    <section class="hero">
      <h1>Sunglasses for long light.</h1>
      <p>Acetate frames, tinted lenses, four shapes. Free returns for 30 days.</p>
      <a class="btn" href="#products">Shop sunglasses</a>
    </section>

    <section id="products" class="grid" aria-label="Products"></section>
  </main>

  <aside id="cart" class="cart" hidden aria-label="Your cart">
    <h2>Your cart</h2>
    <ul id="cart-items"></ul>
    <p class="total">Total: <strong id="cart-total">0 kr</strong></p>
    <button class="btn" id="checkout">Check out</button>
    <p class="msg" id="msg" role="status"></p>
    
  </aside>

products.forEach(p => { p.img = images[p.id]; });

const cart = [];

function glasses(p) {
  const r = p.shape === "round" ? 40 : p.shape === "square" ? 10 : 22;
  return `<svg viewBox="0 0 220 90" role="img" aria-label="${p.name} sunglasses">
    <rect x="16" y="20" width="76" height="52" rx="${r}" fill="${p.lens}" stroke="${p.frame}" stroke-width="7"/>
    <rect x="128" y="20" width="76" height="52" rx="${r}" fill="${p.lens}" stroke="${p.frame}" stroke-width="7"/>
    <path d="M92 34 Q110 22 128 34" fill="none" stroke="${p.frame}" stroke-width="6"/>
    <path d="M16 30 L4 34 M204 30 L216 34" stroke="${p.frame}" stroke-width="6" stroke-linecap="round"/>
  </svg>`;
}

function renderProducts() {
  document.getElementById("products").innerHTML = products.map(p => `
    <article class="card">
      <div class="pic">${p.img ? `<img src="${p.img}" alt="${p.name} sunglasses">` : glasses(p)}</div>
      <h3>${p.name}</h3>
      <p>${p.note} · ${p.price} kr</p>
      <button class="btn" data-id="${p.id}">Add to cart</button>
    </article>`).join("");
}

function renderCart() {
  document.getElementById("cart-count").textContent = cart.length;
  document.getElementById("cart-items").innerHTML = cart.length
    ? cart.map(p => `<li><span>${p.name}</span><span>${p.price} kr</span></li>`).join("")
    : "<li>Your cart is empty. Add a pair to get started.</li>";
  document.getElementById("cart-total").textContent = cart.reduce((s, p) => s + p.price, 0) + " kr";
}

document.getElementById("products").addEventListener("click", e => {
  const id = e.target.dataset.id;
  if (!id) return;
  cart.push(products.find(p => p.id == id));
  renderCart();
});

document.getElementById("cart-toggle").addEventListener("click", e => {
  const panel = document.getElementById("cart");
  panel.hidden = !panel.hidden;
  e.currentTarget.setAttribute("aria-expanded", String(!panel.hidden));
});

const checkoutBtn = document.getElementById("checkout");
const msg = document.getElementById("msg");

checkoutBtn.addEventListener("click", async () => {
  if (!cart.length) { msg.textContent = "Add a pair to your cart first."; return; }
  const counts = {};
  cart.forEach(p => { counts[p.id] = (counts[p.id] || 0) + 1; });
  const items = Object.keys(counts).map(id => ({ id: Number(id), qty: counts[id] }));
  checkoutBtn.disabled = true;
  msg.textContent = "Taking you to secure payment...";
  try {
    const res = await fetch("/.netlify/functions/checkout", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ items })
    });
    const data = await res.json();
    if (!res.ok || !data.url) throw new Error(data.error || "Payment could not start.");
    window.location.href = data.url;
  } catch (e) {
    msg.textContent = "Something went wrong: " + e.message + " Please try again.";
    checkoutBtn.disabled = false;
  }
});

if (location.search.includes("paid=1")) {
  document.getElementById("cart").hidden = false;
  msg.textContent = "Thank you! Your payment went through. A receipt is on its way to your email.";
  history.replaceState(null, "", "/");
}

renderProducts();
renderCart();
</script>
